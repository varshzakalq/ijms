<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The College Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>The College Journal</h1>
      <p class="tagline">All the news that's fit for campus</p>
    </header>

    <!-- AUTH VIEW -->
    <div id="auth-view">
      <div class="auth-box" id="login-box">
        <h2>Sign In</h2>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
          <p class="error" id="login-error"></p>
          <button type="submit">Sign In</button>
        </form>
        <p class="switch">New here? <button class="link" id="show-signup">Create an account</button></p>
      </div>

      <div class="auth-box" id="signup-box" hidden>
        <h2>Sign Up</h2>
        <form id="signup-form">
          <label for="signup-name">Name</label>
          <input type="text" id="signup-name" maxlength="50" required>
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" maxlength="255" required>
          <label for="signup-year">Year (1-6)</label>
          <input type="number" id="signup-year" min="1" max="6" required>
          <label for="signup-password">Password (8-72 characters)</label>
          <input type="password" id="signup-password" minlength="8" required>
          <p class="error" id="signup-error"></p>
          <button type="submit">Create Account</button>
        </form>
        <p class="switch">Already registered? <button class="link" id="show-login">Sign in</button></p>
      </div>
    </div>

    <!-- JOURNAL VIEW -->
    <div id="journal-view" hidden>
      <div class="bar">
        <nav id="nav"></nav>
        <span><span id="today"></span> &nbsp; <button class="link" id="logout">Log out</button></span>
      </div>
      <main id="sections"></main>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
